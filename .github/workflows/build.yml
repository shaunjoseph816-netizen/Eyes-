          else {
          int lum = (((prev >> 16) & 255) + ((prev >> 8) & 255) + (prev & 255)) / 3;
          if (run >= 60 && lum > 60 && start < axis) axis = start;
          run = 1;
          start = x;
          }
          prev = c;
          }
          int lum = (((prev >> 16) & 255) + ((prev >> 8) & 255) + (prev & 255)) / 3;
          if (run >= 60 && lum > 60 && start < axis) axis = start;
          }
          x1 = Math.min(x1, axis - 2);
