          import java.util.ArrayList;
          final class Detect {
          static final class Res { int color, lx, lastX, tris, bigs, axis; boolean recent; }
          static int kind(int c) {
          int r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
          if (r >= 60 && r <= 95 && g >= 160 && g <= 190 && b >= 65 && b <= 95) return 1;
          if (r >= 230 && g >= 40 && g <= 72 && b >= 55 && b <= 88) return 2;
          return 0;
          }
