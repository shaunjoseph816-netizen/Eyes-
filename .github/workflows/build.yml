name: Build Eyes
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate app
        run: |
          mkdir -p app/src/main/java/com/eyes app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo '' | base64 -d > app/debug.keystore
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
          namespace 'com.eyes'
          signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
          compileSdk 34
          defaultConfig { applicationId 'com.eyes'; minSdk 30; targetSdk 34; versionCode 15; versionName '15' }
          compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.WAKE_LOCK"/>
          <queries><package android:name="com.tradingview.tradingviewapp"/><package android:name="net.metaquotes.metatrader5"/></queries>
          <application android:label="Eyes" android:icon="@drawable/icon">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          <service android:name=".EyesService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/eyes_config"/></service>
          </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/eyes_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canRetrieveWindowContent="true" android:canTakeScreenshot="true" android:canPerformGestures="true" android:accessibilityFlags="flagDefault" android:description="@string/d" android:notificationTimeout="100"/>
          EOF
          cat > app/src/main/res/drawable/icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#04050C" android:pathData="M0,0h108v108h-108z"/>
          <path android:fillColor="#4F8CFF" android:pathData="M30,38h8v32h-8z M33,30h2v8h-2z M33,70h2v8h-2z"/>
          <path android:fillColor="#19E3A1" android:pathData="M50,28h8v38h-8z M53,20h2v8h-2z M53,66h2v10h-2z"/>
          <path android:fillColor="#A855F7" android:pathData="M70,44h8v30h-8z M73,36h2v8h-2z M73,74h2v8h-2z"/>
          </vector>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="d">Lets Eyes read the chart, follow the signal and tap in MT5.</string></resources>
          EOF
          cat > app/src/main/java/com/eyes/MainActivity.java <<'EOF'
          package com.eyes;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.*;
          public class MainActivity extends Activity {
          static TextView out;
          static Runnable refresh;
          static TextView jv;
          SharedPreferences sp;
          TextView sigBig, sigSub;
          static final int BG = 0xFF04050C, CARD = 0xFF0A1030, GOLD = 0xFF4F8CFF, VIO = 0xFFA855F7, UP = 0xFF19E3A1, DN = 0xFFFF3B5C, TX = 0xFFEAF2FF, MUT = 0xFF7F8FB5, KEY = 0xFF10184A;
          int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }
          GradientDrawable box(int fill, int stroke, int r) {
          GradientDrawable g = new GradientDrawable();
          g.setColor(fill);
          g.setCornerRadius(dp(r));
          if (stroke != 0) g.setStroke(dp(1), stroke);
          return g;
          }
          TextView tv(String t, int size, int c, boolean bold) {
          TextView x = new TextView(this);
          x.setText(t);
          x.setTextSize(size);
          x.setTextColor(c);
          if (bold) x.setTypeface(Typeface.DEFAULT_BOLD);
          return x;
          }
          LinearLayout card(LinearLayout root, String title) {
          LinearLayout c = new LinearLayout(this);
          c.setOrientation(LinearLayout.VERTICAL);
          c.setPadding(dp(16), dp(14), dp(16), dp(16));
          c.setBackground(box(CARD, 0xAA3B6BFF, 6));
          LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
          p.topMargin = dp(14);
          root.addView(c, p);
          c.addView(tv(title, 11, GOLD, true));
          return c;
          }
          LinearLayout.LayoutParams lp() {
          LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(52));
          p.topMargin = dp(10);
          return p;
          }
          Button btn(String t, boolean primary) {
          Button b = new Button(this);
          b.setText(t);
          b.setAllCaps(false);
          b.setTextSize(15);
          b.setTypeface(Typeface.DEFAULT_BOLD);
          b.setStateListAnimator(null);
          b.setTextColor(primary ? BG : TX);
          b.setBackground(box(primary ? GOLD : KEY, primary ? 0xFFA855F7 : 0x663B6BFF, 6));
          return b;
          }
          EditText ed(String hint, String val) {
          EditText e = new EditText(this);
          e.setHint(hint);
          e.setHintTextColor(MUT);
          e.setTextColor(TX);
          e.setText(val);
          e.setSingleLine(true);
          e.setTextSize(15);
          e.setPadding(dp(12), dp(10), dp(12), dp(10));
          e.setBackground(box(0xFF070B22, 0x663B6BFF, 6));
          return e;
          }
          void paint(Button b, String name, String key) {
          boolean on = sp.getBoolean(key, false);
          b.setText(name + "   " + (on ? "ON" : "OFF"));
          b.setTextColor(on ? BG : TX);
          b.setBackground(box(on ? (key.equals("trade") ? DN : GOLD) : KEY, on ? 0xFFA855F7 : 0x663B6BFF, 6));
          }
          void tog(LinearLayout p, String name, String key) {
          Button b = btn("", false);
          p.addView(b, lp());
          paint(b, name, key);
          b.setOnClickListener(v -> { sp.edit().putBoolean(key, !sp.getBoolean(key, false)).apply(); paint(b, name, key); refresh.run(); });
          }
          String journalText() {
          String j = sp.getString("journal", "");
          if (j.isEmpty()) return "No trades logged yet.";
          String[] a = j.split("\n");
          int n = 0, w = 0;
          double net = 0;
          for (String l : a) {
          if (l.contains("CLOSED")) {
          String[] p = l.trim().split("\\s+");
          try { double v = Double.parseDouble(p[p.length - 1]); n++; net += v; if (v > 0) w++; } catch (Exception e) {}
          }
          }
          StringBuilder sb = new StringBuilder("Closed: " + n + "   Wins: " + w + "   Net: " + String.format(java.util.Locale.US, "%+.2f", net) + "\n");
          for (int i = Math.max(0, a.length - 6); i < a.length; i++) sb.append(a[i]).append('\n');
          return sb.toString().trim();
          }
          protected void onCreate(Bundle b0) {
          super.onCreate(b0);
          sp = getSharedPreferences("eyes", 0);
          if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
          getWindow().setStatusBarColor(BG);
          getWindow().setNavigationBarColor(BG);
          ScrollView sv = new ScrollView(this);
          sv.setBackgroundColor(BG);
          LinearLayout root = new LinearLayout(this);
          root.setOrientation(LinearLayout.VERTICAL);
          root.setPadding(dp(18), dp(44), dp(18), dp(28));
          sv.addView(root);
          TextView sys = tv("[ SYSTEM ]", 11, GOLD, true);
          sys.setLetterSpacing(0.3f);
          root.addView(sys);
          TextView ttl = tv("EYES", 38, TX, true);
          ttl.setLetterSpacing(0.25f);
          root.addView(ttl);
          root.addView(tv("ARISE  \u00B7  MARKET HUNTER  \u00B7  DISCIPLINE. AUTOMATIC.", 11, MUT, false));
          LinearLayout sig = card(root, "SYSTEM  \u00B7  SIGNAL");
          sigBig = tv("WAITING", 42, TX, true);
          sigSub = tv("", 13, MUT, false);
          sig.addView(sigBig);
          sig.addView(sigSub);
          refresh = () -> {
          String last = sp.getString("last", "");
          if (last.equals("GREEN")) { sigBig.setText("BUY \u25B2"); sigBig.setTextColor(UP); }
          else if (last.equals("RED")) { sigBig.setText("SELL \u25BC"); sigBig.setTextColor(DN); }
          else { sigBig.setText("AWAITING SIGNAL"); sigBig.setTextColor(TX); }
          String pair = sp.getString("sym", "").isEmpty() ? "any chart" : sp.getString("sym", "");
          String tf = sp.getString("tf", "").isEmpty() ? "" : "  \u00B7  " + sp.getString("tf", "") + "m";
          sigSub.setText(pair + tf + "  \u00B7  " + (sp.getBoolean("trade", false) ? "TRADING LIVE" : "WATCH ONLY"));
          if (jv != null) jv.setText(journalText());
          };
          LinearLayout ag = card(root, "SYSTEM  \u00B7  HUNTER");
          Button chk = btn("ARISE  \u2014  CHECK SIGNAL", true);
          ag.addView(chk, lp());
          chk.setOnClickListener(v -> {
          if (EyesService.me == null) out.setText("Eyes is off. Enable it in Accessibility first.");
          else { out.setText("Looking..."); EyesService.me.check(); }
          });
          tog(ag, "Auto-check every 30 min", "auto");
          tog(ag, "Place trades", "trade");
          tog(ag, "Auto-switch chart (experimental)", "switch");
          tog(ag, "Add-ons on small triangles", "adds");
          LinearLayout ch = card(root, "SYSTEM  \u00B7  CHART");
          EditText sym = ed("Symbol on chart (e.g. BTCUSD)", sp.getString("sym", ""));
          EditText tfe = ed("Timeframe in minutes (e.g. 30)", sp.getString("tf", ""));
          tfe.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);
          EditText exe = ed("Exchange (optional, e.g. Bitstamp)", sp.getString("exch", ""));
          EditText mxe = ed("Max add-ons per signal (e.g. 2)", sp.getString("maxadd", "2"));
          mxe.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);
          ch.addView(sym, lp());
          ch.addView(tfe, lp());
          ch.addView(exe, lp());
          ch.addView(mxe, lp());
          Button sv2 = btn("Save chart settings", false);
          ch.addView(sv2, lp());
          sv2.setOnClickListener(v -> {
          sp.edit().putString("sym", sym.getText().toString().trim()).putString("tf", tfe.getText().toString().trim()).putString("exch", exe.getText().toString().trim()).putString("maxadd", mxe.getText().toString().trim()).commit();
          out.setText("Saved: " + sym.getText() + " " + tfe.getText() + " min");
          android.widget.Toast.makeText(this, "Saved: " + sym.getText() + " " + tfe.getText() + " min", android.widget.Toast.LENGTH_LONG).show();
          refresh.run();
          });
          LinearLayout tl = card(root, "SYSTEM  \u00B7  TOOLS");
          Button acc = btn("Enable Eyes in Accessibility", false);
          tl.addView(acc, lp());
          acc.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
          Button tst = btn("Test MT5: close all, then BUY", false);
          tst.setTextColor(DN);
          tl.addView(tst, lp());
          tst.setOnClickListener(v -> {
          if (EyesService.me == null) out.setText("Eyes is off. Enable it in Accessibility first.");
          else { out.setText("Testing MT5..."); EyesService.me.prev = EyesService.me.sp.getString("last", ""); EyesService.me.trade(true, false); }
          });
          Button dg = btn("Diagnose chart (saves a text file)", false);
          tl.addView(dg, lp());
          dg.setOnClickListener(v -> {
          if (EyesService.me == null) out.setText("Eyes is off. Enable it in Accessibility first.");
          else { out.setText("Diagnosing..."); EyesService.me.diagnose(); }
          });
          Button fg = btn("Forget last signal", false);
          tl.addView(fg, lp());
          fg.setOnClickListener(v -> { sp.edit().remove("last").remove("open").apply(); refresh.run(); });
          LinearLayout fd = card(root, "QUEST LOG  \u00B7  TRADE JOURNAL");
          out = tv(EyesService.last, 14, TX, false);
          out.setTypeface(Typeface.MONOSPACE);
          fd.addView(out);
          jv = tv("", 12, MUT, false);
          jv.setTypeface(Typeface.MONOSPACE);
          jv.setPadding(0, dp(10), 0, 0);
          fd.addView(jv);
          TextView ft = tv("Automated trading carries risk. Always test on a demo account first.", 11, MUT, false);
          ft.setPadding(0, dp(16), 0, 0);
          root.addView(ft);
          setContentView(sv);
          refresh.run();
          }
          protected void onResume() { super.onResume(); if (refresh != null) refresh.run(); }
          }
          EOF
          cat > app/src/main/java/com/eyes/Detect.java <<'EOF'
          package com.eyes;
          import java.util.ArrayList;
          final class Detect {
          static final class Res { int color, lx, lastX, tris, bigs, axis; boolean recent; }
          static int kind(int c) {
          int r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
          if (r >= 60 && r <= 95 && g >= 160 && g <= 190 && b >= 65 && b <= 95) return 1;
          if (r >= 230 && g >= 40 && g <= 72 && b >= 55 && b <= 88) return 2;
          return 0;
          }
          static Res run(int[] p, int w, int h) {
          Res out = new Res();
          int x1 = (int) (0.86 * w), y0 = (int) (0.115 * h), y1 = (int) (0.80 * h);
          int axis = x1 + 2;
          for (int y = (int) (0.19 * h); y < (int) (0.59 * h); y += 2) {
          int run = 1, start = (int) (0.70 * w);
          int prev = p[y * w + start];
          for (int x = start + 1; x < w; x++) {
          int c = p[y * w + x];
          int dr = ((c >> 16) & 255) - ((prev >> 16) & 255), dg = ((c >> 8) & 255) - ((prev >> 8) & 255), db = (c & 255) - (prev & 255);
          if (Math.abs(dr) <= 12 && Math.abs(dg) <= 12 && Math.abs(db) <= 12) run++;
          else {
          int lum = (((prev >> 16) & 255) + ((prev >> 8) & 255) + (prev & 255)) / 3;
          if (run >= 60 && lum > 60 && start < axis) axis = start;
          run = 1;
          start = x;
          }
          prev = c;
          }
          int lum = (((prev >> 16) & 255) + ((prev >> 8) & 255) + (prev & 255)) / 3;
          if (run >= 60 && lum > 60 && start < axis) axis = start;
          }
          x1 = Math.min(x1, axis - 2);
          byte[] k = new byte[w * h];
          for (int y = y0; y < y1; y++) for (int x = 0; x < x1; x++) k[y * w + x] = (byte) kind(p[y * w + x]);
          boolean[] seen = new boolean[w * h];
          int[] st = new int[w * h];
          ArrayList<int[]> cs = new ArrayList<>();
          for (int y = y0; y < y1; y++) {
          for (int x = 0; x < x1; x++) {
          int i = y * w + x;
          if (k[i] == 0 || seen[i]) continue;
          int col = k[i], sp = 0, mnx = x, mxx = x, mny = y, mxy = y, n = 0;
          st[sp++] = i;
          seen[i] = true;
          while (sp > 0) {
          int j = st[--sp];
          int cy = j / w, cx = j - cy * w;
          n++;
          if (cx < mnx) mnx = cx;
          if (cx > mxx) mxx = cx;
          if (cy < mny) mny = cy;
          if (cy > mxy) mxy = cy;
          if (cx > 0 && k[j - 1] == col && !seen[j - 1]) { seen[j - 1] = true; st[sp++] = j - 1; }
          if (cx < x1 - 1 && k[j + 1] == col && !seen[j + 1]) { seen[j + 1] = true; st[sp++] = j + 1; }
          if (cy > y0 && k[j - w] == col && !seen[j - w]) { seen[j - w] = true; st[sp++] = j - w; }
          if (cy < y1 - 1 && k[j + w] == col && !seen[j + w]) { seen[j + w] = true; st[sp++] = j + w; }
          }
          if (n >= 30) cs.add(new int[]{col, mnx, mny, mxx, mxy, n});
          }
          }
          int gap = (int) (0.016 * h);
          boolean again = true;
          while (again) {
          again = false;
          for (int a = 0; a < cs.size() && !again; a++) {
          for (int b = a + 1; b < cs.size() && !again; b++) {
          int[] A = cs.get(a), B = cs.get(b);
          if (A[0] != B[0]) continue;
          int ov = Math.min(A[3], B[3]) - Math.max(A[1], B[1]) + 1;
          int nw = Math.min(A[3] - A[1], B[3] - B[1]) + 1;
          int vg = Math.max(A[2], B[2]) - Math.min(A[4], B[4]);
          if (ov >= 0.6 * nw && vg <= gap) {
          A[1] = Math.min(A[1], B[1]); A[2] = Math.min(A[2], B[2]); A[3] = Math.max(A[3], B[3]); A[4] = Math.max(A[4], B[4]); A[5] += B[5];
          cs.remove(b);
          again = true;
          }
          }
          }
          }
          out.axis = axis;
          int bestX = -1;
          ArrayList<int[]> tri = new ArrayList<>();
          for (int[] c : cs) {
          int bw = c[3] - c[1] + 1, bh = c[4] - c[2] + 1;
          double fill = c[5] / (double) (bw * bh);
          if (bw >= 0.040 * w && bw <= 0.14 * w && bh >= 0.025 * h && bh <= 0.075 * h && fill >= 0.25) {
          int cx = bw > 0.07 * w ? c[3] - (int) (0.03 * w) : (c[1] + c[3]) / 2;
          out.bigs++;
          if (cx >= bestX) { bestX = cx; out.color = c[0]; out.lx = cx; }
          } else if (bw >= 0.022 * w && bw <= 0.045 * w && bh >= 0.0138 * h && bh <= 0.020 * h && fill >= 0.40 && fill <= 0.70) {
          tri.add(new int[]{c[0], (c[1] + c[3]) / 2});
          }
          }
          if (out.color != 0) {
          for (int[] t : tri) if (t[0] == out.color && t[1] > out.lx + (int) (0.034 * w)) out.tris++;
          }
          int ya = (int) (0.30 * h), yb = (int) (0.74 * h);
          out.lastX = -1;
          for (int x = Math.min(x1, (int) (0.83 * w)) - 1; x >= 0 && out.lastX < 0; x--) {
          int n = 0;
          for (int y = ya; y < yb; y++) {
          int c = p[y * w + x];
          if ((((c >> 16) & 255) + ((c >> 8) & 255) + (c & 255)) > 210) n++;
          }
          if (n >= 4) out.lastX = x;
          }
          out.recent = out.color != 0 && out.lastX >= 0 && Math.abs(out.lastX - out.lx) <= 0.10 * w;
          return out;
          }
          }
          EOF
          cat > app/src/main/java/com/eyes/EyesService.java <<'EOF'
          package com.eyes;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.hardware.HardwareBuffer;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import java.util.Calendar;
          import java.util.List;
          public class EyesService extends AccessibilityService {
          static EyesService me;
          static String last = "No check yet.";
          Handler h = new Handler(Looper.getMainLooper());
          SharedPreferences sp;
          int lastSlot = -1;
          int tries = 0;
          int first = -1;
          int firstTris = 0;
          Runnable loop = new Runnable() {
          public void run() {
          Calendar c = Calendar.getInstance();
          int m = c.get(Calendar.MINUTE);
          int slot = c.get(Calendar.DAY_OF_YEAR) * 100 + c.get(Calendar.HOUR_OF_DAY) * 2 + (m >= 30 ? 1 : 0);
          if (sp.getBoolean("auto", false) && m % 30 == 0 && c.get(Calendar.SECOND) >= 8 && slot != lastSlot) { lastSlot = slot; check(); }
          h.postDelayed(this, 5000);
          }
          };
          public void onServiceConnected() { me = this; sp = getSharedPreferences("eyes", 0); h.removeCallbacks(loop); h.post(loop); }
          public void onAccessibilityEvent(AccessibilityEvent e) {}
          public void onInterrupt() {}
          public boolean onUnbind(Intent i) { me = null; return super.onUnbind(i); }
          void say(String t) {
          last = t;
          if (MainActivity.out != null) MainActivity.out.setText(t);
          if (MainActivity.refresh != null) MainActivity.refresh.run();
          Toast.makeText(this, t, Toast.LENGTH_LONG).show();
          }
          void note(String t) {
          say(t);
          NotificationManager nm = getSystemService(NotificationManager.class);
          nm.createNotificationChannel(new NotificationChannel("eyes", "Eyes", NotificationManager.IMPORTANCE_HIGH));
          nm.notify((int) (System.currentTimeMillis() % 100000), new Notification.Builder(this, "eyes").setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle("Eyes").setContentText(t).setStyle(new Notification.BigTextStyle().bigText(t)).build());
          }
          boolean open(String pkg) {
          Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
          if (i == null) { note("App not found: " + pkg); return false; }
          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
          startActivity(i);
          return true;
          }
          void check() {
          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
          pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP, "eyes:w").acquire(180000);
          if (!open("com.tradingview.tradingviewapp")) return;
          tries = 0;
          first = -1;
          chartOk = true;
          h.postDelayed(() -> tap("Chart"), 3000);
          h.postDelayed(() -> dismissAd(), 8000);
          h.postDelayed(() -> dismissAd(), 15000);
          boolean sw = sp.getBoolean("switch", false);
          if (sw) { h.postDelayed(() -> ensureChart(), 9000); h.postDelayed(() -> chartOk = chartMatches(), 30000); }
          h.postDelayed(() -> shot(), sw ? 33000 : 20000);
          }
          void decide(Detect.Res r, int tris) {
          if (r.color == 0) {
          if (tries < 1) { tries++; h.postDelayed(() -> shot(), 6000); return; }
          tries = 0;
          note("No big label found, so I did nothing.");
          return;
          }
          tries = 0;
          int bc = r.color;
          String now = bc == 1 ? "GREEN" : "RED";
          String old = sp.getString("last", "");
          if (old.isEmpty()) { sp.edit().putString("last", now).putInt("seen", -1).apply(); note("Started: " + now + ". No trade yet; waiting for a change."); return; }
          if (old.equals(now)) { note("No change: still " + now + "."); adds(bc, tris); return; }
          if (!r.recent) { note("The newest " + now + " label I can see is old, so I ignored it and did nothing."); return; }
          sp.edit().putString("last", now).putInt("seen", -1).putInt("addn", 0).apply();
          boolean buy = bc == 1;
          if (!sp.getBoolean("trade", false)) { note("Signal turned " + now + ". Trading is OFF, so I would close all and " + (buy ? "BUY" : "SELL") + "."); return; }
          note("Signal turned " + now + ". Closing all, then " + (buy ? "BUY" : "SELL") + ".");
          prev = old;
          if (!trade(buy, sp.getBoolean("open", false))) sp.edit().putString("last", old).apply();
          }
          void adds(int bc, int tris) {
          if (!sp.getBoolean("adds", false)) return;
          int seen = sp.getInt("seen", -1);
          sp.edit().putInt("seen", tris).apply();
          if (seen < 0 || tris <= seen) return;
          int max = 2;
          try { max = Integer.parseInt(want("maxadd")); } catch (Exception e) {}
          int done = sp.getInt("addn", 0);
          String side = bc == 1 ? "BUY" : "SELL";
          if (done >= max) { note("New triangle, but the add-on limit (" + max + ") is reached."); return; }
          if (!sp.getBoolean("trade", false)) { note("New triangle. Trading is OFF, so I would add one more " + side + "."); return; }
          sp.edit().putInt("addn", done + 1).apply();
          note("New triangle. Adding one more " + side + " (" + (done + 1) + " of " + max + ").");
          addOn(bc == 1);
          }
          void addOn(boolean buy) {
          if (!open(M5)) return;
          until(() -> inPkg(M5), 30000, () -> h.postDelayed(() -> toCharts(() -> pillNow(st -> {
          if (st != 1) { note("Add-on skipped: I do not see an open trade."); return; }
          tapXY(buy ? 0.833f : 0.139f, 0.125f);
          h.postDelayed(() -> { journal(buy ? "ADD BUY" : "ADD SELL", ""); note((buy ? "BUY" : "SELL") + " add-on tapped. Check MT5."); }, 3000);
          })), 2500), () -> note("MT5 did not open for the add-on."));
          }
          static final String M5 = "net.metaquotes.metatrader5";
          String prev = "";
          boolean chartOk = true;
          void until(java.util.function.BooleanSupplier ok, int ms, Runnable then, Runnable fail) {
          long end = System.currentTimeMillis() + ms;
          Runnable r = new Runnable() {
          public void run() {
          if (ok.getAsBoolean()) then.run();
          else if (System.currentTimeMillis() > end) fail.run();
          else h.postDelayed(this, 500);
          }
          };
          h.post(r);
          }
          boolean has(String t) {
          AccessibilityNodeInfo r = getRootInActiveWindow();
          return r != null && !r.findAccessibilityNodeInfosByText(t).isEmpty();
          }
          boolean inPkg(String p) {
          AccessibilityNodeInfo r = getRootInActiveWindow();
          return r != null && p.equals(String.valueOf(r.getPackageName()));
          }
          boolean seen(AccessibilityNodeInfo n, String t) {
          if (n == null) return false;
          CharSequence x = n.getText();
          if (x != null && x.toString().trim().equalsIgnoreCase(t)) return true;
          CharSequence d = n.getContentDescription();
          if (d != null && d.toString().trim().equalsIgnoreCase(t)) return true;
          for (int i = 0; i < n.getChildCount(); i++) if (seen(n.getChild(i), t)) return true;
          return false;
          }
          String want(String k) { return sp.getString(k, "").trim(); }
          String tfLabel(String m) {
          try { int v = Integer.parseInt(m); if (v >= 1440) return (v / 1440) + "D"; if (v >= 60 && v % 60 == 0) return (v / 60) + "h"; return v + "m"; }
          catch (Exception e) { return m; }
          }
          boolean chartMatches() {
          String s = want("sym"), t = want("tf");
          if (!s.isEmpty() && !seen(getRootInActiveWindow(), s)) return false;
          if (!t.isEmpty() && !seen(getRootInActiveWindow(), tfLabel(t))) return false;
          return true;
          }
          boolean anyM(AccessibilityNodeInfo n) {
          if (n == null) return false;
          CharSequence x = n.getText();
          if (x != null && x.toString().matches("\\d+m")) return true;
          for (int i = 0; i < n.getChildCount(); i++) if (anyM(n.getChild(i))) return true;
          return false;
          }
          AccessibilityNodeInfo rowOf(AccessibilityNodeInfo n) {
          if (n == null) return null;
          for (int i = 0; i < n.getChildCount(); i++) { AccessibilityNodeInfo r = rowOf(n.getChild(i)); if (r != null) return r; }
          return (n.isScrollable() && anyM(n)) ? n : null;
          }
          boolean clickText(String t) {
          AccessibilityNodeInfo r = getRootInActiveWindow();
          if (r == null) return false;
          for (AccessibilityNodeInfo n : r.findAccessibilityNodeInfosByText(t)) {
          CharSequence x = n.getText();
          if (x == null || n.isEditable() || !x.toString().trim().equalsIgnoreCase(t)) continue;
          AccessibilityNodeInfo c = n;
          while (c != null && !c.isClickable()) c = c.getParent();
          if (c != null) { c.performAction(AccessibilityNodeInfo.ACTION_CLICK); return true; }
          }
          return false;
          }
          boolean clickRow(String s, String e) {
          AccessibilityNodeInfo r = getRootInActiveWindow();
          if (r == null) return false;
          for (AccessibilityNodeInfo n : r.findAccessibilityNodeInfosByText(s)) {
          CharSequence x = n.getText();
          if (x == null || n.isEditable() || !x.toString().trim().equalsIgnoreCase(s)) continue;
          AccessibilityNodeInfo a = n;
          for (int i = 0; i < 4 && a != null; i++, a = a.getParent()) {
          if (e.isEmpty() || seen(a, e)) {
          AccessibilityNodeInfo c = n;
          while (c != null && !c.isClickable()) c = c.getParent();
          if (c != null) { c.performAction(AccessibilityNodeInfo.ACTION_CLICK); return true; }
          }
          }
          }
          return false;
          }
          void pick(String label, int n) {
          if (clickText(label)) { h.postDelayed(() -> { if (has("Interval")) performGlobalAction(GLOBAL_ACTION_BACK); }, 1500); return; }
          if (n >= 6) { performGlobalAction(GLOBAL_ACTION_BACK); return; }
          AccessibilityNodeInfo row = rowOf(getRootInActiveWindow());
          if (row != null) row.performAction(n % 2 == 0 ? AccessibilityNodeInfo.ACTION_SCROLL_FORWARD : AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD);
          h.postDelayed(() -> pick(label, n + 1), 800);
          }
          void setTf(String t) {
          if (t.isEmpty() || seen(getRootInActiveWindow(), tfLabel(t))) return;
          tapXY(0.292f, 0.851f);
          until(() -> has("Interval"), 5000, () -> pick(tfLabel(t), 0), () -> {});
          }
          void setSymbol(String s, Runnable then) {
          tapXY(0.26f, 0.056f);
          until(() -> has("Futures"), 6000, () -> {
          AccessibilityNodeInfo root = getRootInActiveWindow();
          AccessibilityNodeInfo f = root == null ? null : root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
          if (f != null) {
          android.os.Bundle a = new android.os.Bundle();
          a.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, s);
          f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, a);
          }
          h.postDelayed(() -> {
          if (!clickRow(s, want("exch"))) performGlobalAction(GLOBAL_ACTION_BACK);
          h.postDelayed(then, 3000);
          }, 2500);
          }, () -> {});
          }
          void ensureChart() {
          String s = want("sym"), t = want("tf");
          if (!s.isEmpty() && !seen(getRootInActiveWindow(), s)) setSymbol(s, () -> setTf(t));
          else setTf(t);
          }
          void dump(AccessibilityNodeInfo n, StringBuilder sb, int d) {
          if (n == null || d > 40) return;
          CharSequence x = n.getText(), c = n.getContentDescription();
          if (x != null || c != null) {
          android.graphics.Rect r = new android.graphics.Rect();
          n.getBoundsInScreen(r);
          sb.append(r.left).append(',').append(r.top).append(n.isClickable() ? " C " : " - ").append(x == null ? "" : x).append(" | ").append(c == null ? "" : c).append('\n');
          }
          for (int i = 0; i < n.getChildCount(); i++) dump(n.getChild(i), sb, d + 1);
          }
          void saveText(String name, String text) {
          try {
          android.content.ContentValues v = new android.content.ContentValues();
          v.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name);
          v.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, "text/plain");
          v.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, "Download/Eyes");
          android.net.Uri u = getContentResolver().insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
          java.io.OutputStream o = getContentResolver().openOutputStream(u);
          o.write(text.getBytes());
          o.close();
          } catch (Exception e) {}
          }
          void diagnose() {
          if (!open("com.tradingview.tradingviewapp")) return;
          h.postDelayed(() -> tap("Chart"), 3000);
          h.postDelayed(() -> {
          StringBuilder sb = new StringBuilder("== chart screen ==\n");
          dump(getRootInActiveWindow(), sb, 0);
          saveText("eyes_screen_" + System.currentTimeMillis() + ".txt", sb.toString());
          note("Saved a text file in Download/Eyes. Send it to Claude.");
          }, 12000);
          }
          void dismissAd() {
          if (!has("Explore our plans")) return;
          if (!clickText("Close")) tapXY(0.917f, 0.631f);
          }
          void abort(String why) {
          sp.edit().putString("last", prev).apply();
          note("STOPPED: " + why + " No new trade was opened. I will retry at the next check.");
          }
          boolean trade(boolean buy, boolean must) {
          if (!open(M5)) return false;
          until(() -> inPkg(M5), 30000, () -> h.postDelayed(() -> toCharts(() -> checkFlat(buy, 0)), 2500), () -> abort("MT5 did not open."));
          return true;
          }
          void shotBmp(java.util.function.Consumer<Bitmap> cb) {
          takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(), new TakeScreenshotCallback() {
          public void onSuccess(ScreenshotResult s) { cb.accept(grab(s)); }
          public void onFailure(int c) { cb.accept(null); }
          });
          }
          boolean tradeScreen(Bitmap bm) {
          int w = bm.getWidth(), h2 = bm.getHeight();
          double s = 0, q = 0;
          int n = 0;
          for (int y = (int) (h2 * 0.277); y < (int) (h2 * 0.299); y += 2) {
          for (int x = (int) (w * 0.30); x < (int) (w * 0.60); x += 3) {
          int c = bm.getPixel(x, y);
          double v = (((c >> 16) & 255) + ((c >> 8) & 255) + (c & 255)) / 3.0;
          s += v; q += v * v; n++;
          }
          }
          double m = s / n, sd = Math.sqrt(Math.max(0, q / n - m * m));
          return m > 25 && m < 55 && sd < 4;
          }
          boolean chartsScreen(Bitmap bm) {
          int w = bm.getWidth(), h2 = bm.getHeight();
          long sat = 0;
          int n = 0;
          for (int y = (int) (h2 * 0.141); y < (int) (h2 * 0.147); y++) {
          for (int x = (int) (w * 0.02); x < (int) (w * 0.15); x += 2) {
          int c = bm.getPixel(x, y), r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
          sat += Math.max(r, Math.max(g, b)) - Math.min(r, Math.min(g, b));
          n++;
          }
          }
          return n > 0 && sat / n > 90;
          }
          void toCharts(Runnable then) {
          shotBmp(bm -> {
          if (bm != null && chartsScreen(bm)) { h.postDelayed(then, 500); return; }
          tapXY(0.306f, 0.885f);
          h.postDelayed(then, 2000);
          });
          }
          AccessibilityNodeInfo findPill(AccessibilityNodeInfo n, int top) {
          if (n == null) return null;
          CharSequence x = n.getText();
          if (x != null && x.toString().trim().matches("-?\\d+(\\.\\d+)?")) {
          android.graphics.Rect b = new android.graphics.Rect();
          n.getBoundsInScreen(b);
          if (b.top > top) return n;
          }
          for (int i = 0; i < n.getChildCount(); i++) { AccessibilityNodeInfo f = findPill(n.getChild(i), top); if (f != null) return f; }
          return null;
          }
          String pillText() {
          int top = (int) (getResources().getDisplayMetrics().heightPixels * 0.84);
          AccessibilityNodeInfo n = findPill(getRootInActiveWindow(), top);
          return n == null ? "?" : n.getText().toString().trim();
          }
          void journal(String what, String val) {
          String line = new java.text.SimpleDateFormat("MM-dd HH:mm", java.util.Locale.US).format(new java.util.Date()) + "  " + what + "  " + val;
          String old = sp.getString("journal", "");
          String[] a = old.isEmpty() ? new String[0] : old.split("\n");
          StringBuilder sb = new StringBuilder();
          for (int i = Math.max(0, a.length - 59); i < a.length; i++) sb.append(a[i]).append('\n');
          sb.append(line);
          sp.edit().putString("journal", sb.toString()).apply();
          }
          int pillState(Bitmap bm) {
          int w = bm.getWidth(), h2 = bm.getHeight();
          int x0 = (int) (w * 0.453), x1 = (int) (w * 0.55), y0 = (int) (h2 * 0.8975), y1 = (int) (h2 * 0.9125);
          long r = 0, b = 0;
          int n = 0;
          for (int y = y0; y < y1; y++) {
          for (int x = x0; x < x1; x++) {
          int c = bm.getPixel(x, y), cr = (c >> 16) & 255, cg = (c >> 8) & 255, cb = c & 255;
          if (cr + cg + cb < 330) { r += cr; b += cb; n++; }
          }
          }
          if (n < 100) return -1;
          long dr = r / n, db = b / n;
          return ((db - dr) > 22 || (dr - db) > 18) ? 1 : 0;
          }
          void pillNow(java.util.function.IntConsumer cb) {
          takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(), new TakeScreenshotCallback() {
          public void onSuccess(ScreenshotResult s) { Bitmap bm = grab(s); save(bm, "mt5"); cb.accept(pillState(bm)); }
          public void onFailure(int c) { cb.accept(-1); }
          });
          }
          void checkFlat(boolean buy, int round) {
          pillNow(st -> {
          if (st < 0) { abort("I could not read MT5 to see if a trade is open."); return; }
          if (st == 0) { if (round > 0) journal("CLOSED", sp.getString("pnl", "?")); enter(buy); return; }
          if (round >= 2) { abort("A trade is still open after trying to close it."); return; }
          if (round == 0) sp.edit().putString("pnl", pillText()).apply();
          closeAll(() -> toCharts(() -> checkFlat(buy, round + 1)), () -> abort("I could not reach the trades screen in MT5 (last tap " + tapInfo + ")."));
          });
          }
          void closeAll(Runnable ok, Runnable fail) { toTradeTab(0, ok, fail); }
          void toTradeTab(int n, Runnable ok, Runnable fail) {
          tapXY(0.507f, 0.89f);
          h.postDelayed(() -> shotBmp(bm -> {
          if (bm != null && tradeScreen(bm)) { tapXY(0.936f, 0.288f); h.postDelayed(() -> pressCloseAll(0, ok), 1500); }
          else if (n < 3) toTradeTab(n + 1, ok, fail);
          else fail.run();
          }), 2000);
          }
          void pressCloseAll(int n, Runnable ok) {
          if (has("Close All Positions")) { tap("Close All Positions"); h.postDelayed(ok, 3000); return; }
          if (n == 0) { tapXY(0.936f, 0.288f); h.postDelayed(() -> pressCloseAll(1, ok), 1500); return; }
          tapXY(0.2f, 0.836f);
          h.postDelayed(ok, 3000);
          }
          void enter(boolean buy) {
          tapXY(buy ? 0.833f : 0.139f, 0.125f);
          h.postDelayed(() -> pillNow(st -> {
          if (st == 1) { sp.edit().putBoolean("open", true).apply(); journal(buy ? "BUY opened" : "SELL opened", ""); note((buy ? "BUY" : "SELL") + " placed and confirmed."); }
          else { sp.edit().putString("last", prev).apply(); note((buy ? "BUY" : "SELL") + " tapped but I could not confirm it. I will retry at the next check. Look at MT5."); }
          }), 4000);
          }
          String tapInfo = "";
          void tapXY(float fx, float fy) {
          android.graphics.Rect b = getSystemService(android.view.WindowManager.class).getMaximumWindowMetrics().getBounds();
          float x = fx * b.width(), y = fy * b.height();
          tapInfo = (int) x + "," + (int) y + " of " + b.width() + "x" + b.height();
          Path p = new Path();
          p.moveTo(x, y);
          dispatchGesture(new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p, 0, 60)).build(), null, null);
          }
          boolean tap(String t) {
          AccessibilityNodeInfo r = getRootInActiveWindow();
          if (r == null) return false;
          List<AccessibilityNodeInfo> l = r.findAccessibilityNodeInfosByText(t);
          for (AccessibilityNodeInfo n : l) {
          AccessibilityNodeInfo x = n;
          while (x != null && !x.isClickable()) x = x.getParent();
          if (x != null) { x.performAction(AccessibilityNodeInfo.ACTION_CLICK); return true; }
          }
          return false;
          }
          Bitmap grab(ScreenshotResult s) {
          HardwareBuffer hb = s.getHardwareBuffer();
          Bitmap bm = Bitmap.wrapHardwareBuffer(hb, s.getColorSpace()).copy(Bitmap.Config.ARGB_8888, false);
          hb.close();
          return bm;
          }
          void save(Bitmap bm, String tag) {
          try {
          android.content.ContentValues v = new android.content.ContentValues();
          v.put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, "eyes_" + tag + "_" + System.currentTimeMillis() + ".jpg");
          v.put(android.provider.MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
          v.put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Eyes");
          android.net.Uri u = getContentResolver().insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
          java.io.OutputStream o = getContentResolver().openOutputStream(u);
          bm.compress(Bitmap.CompressFormat.JPEG, 85, o);
          o.close();
          } catch (Exception e) {}
          }
          void snap() {
          takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(), new TakeScreenshotCallback() {
          public void onSuccess(ScreenshotResult s) { save(grab(s), "mt5"); }
          public void onFailure(int c) {}
          });
          }
          void shot() {
          takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(), new TakeScreenshotCallback() {
          public void onSuccess(ScreenshotResult s) {
          Bitmap bm = grab(s);
          save(bm, "tv");
          int w = bm.getWidth(), hh = bm.getHeight();
          int[] px = new int[w * hh];
          bm.getPixels(px, 0, w, 0, 0, w, hh);
          Detect.Res r = Detect.run(px, w, hh);
          int bc = r.color;
          if (first < 0) { first = bc; firstTris = r.tris; h.postDelayed(() -> shot(), 6000); }
          else {
          int f = first, ft = firstTris;
          first = -1;
          if (f == bc) { if (chartOk) decide(r, Math.min(ft, r.tris)); else note("Wrong chart: expected " + want("sym") + " " + tfLabel(want("tf")) + ". Did nothing."); }
          else note("Two reads disagreed, so I skipped this check.");
          }
          }
          public void onFailure(int c) {
          if (tries < 2) { tries++; h.postDelayed(() -> shot(), 4000); }
          else { tries = 0; note("Screenshot failed (" + c + ")."); }
          }
          });
          }
          }
