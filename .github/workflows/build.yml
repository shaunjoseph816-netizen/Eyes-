          android.graphics.Rect b = getSystemService(android.view.WindowManager.class).getMaximumWindowMetrics().getBounds();
          float x = fx * b.width(), y = fy * b.height();
          tapInfo = (int) x + "," + (int) y + " of " + b.width() + "x" + b.height();
          Path p = new Path();
          p.moveTo(x, y);
          dispatchGesture(new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p, 0, 60)).build(), null, null);
          }
          boolean tap(String t) {
          AccessibilityNodeInfo r = getRootInActiveWindow();
          if (r == null) return false;
          List<AccessibilityNodeInfo> l = r.findAccessibilityNodeInfosByText(t);
          for (AccessibilityNodeInfo n : l) {
          AccessibilityNodeInfo x = n;
          while (x != null && !x.isClickable()) x = x.getParent();
          if (x != null) { x.performAction(AccessibilityNodeInfo.ACTION_CLICK); return true; }
          }
          return false;
          }
          Bitmap grab(ScreenshotResult s) {
          HardwareBuffer hb = s.getHardwareBuffer();
          Bitmap bm = Bitmap.wrapHardwareBuffer(hb, s.getColorSpace()).copy(Bitmap.Config.ARGB_8888, false);
          hb.close();
          return bm;
          }
          void save(Bitmap bm, String tag) {
          try {
          android.content.ContentValues v = new android.content.ContentValues();
          v.put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, "eyes_" + tag + "_" + System.currentTimeMillis() + ".jpg");
          v.put(android.provider.MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
          v.put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Eyes");
          android.net.Uri u = getContentResolver().insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
          java.io.OutputStream o = getContentResolver().openOutputStream(u);
          bm.compress(Bitmap.CompressFormat.JPEG, 85, o);
          o.close();
          } catch (Exception e) {}
          }
          void snap() {
          takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(), new TakeScreenshotCallback() {
          public void onSuccess(ScreenshotResult s) { save(grab(s), "mt5"); }
          public void onFailure(int c) {}
          });
          }
          void shot() {
          takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(), new TakeScreenshotCallback() {
          public void onSuccess(ScreenshotResult s) {
          Bitmap bm = grab(s);
          save(bm, "tv");
          int w = bm.getWidth(), hh = bm.getHeight();
          int[] px = new int[w * hh];
          bm.getPixels(px, 0, w, 0, 0, w, hh);
          Detect.Res r = Detect.run(px, w, hh);
          int bc = r.color;
          if (first < 0) { first = bc; firstTris = r.tris; h.postDelayed(() -> shot(), 6000); }
          else {
          int f = first, ft = firstTris;
          first = -1;
          if (f == bc) { if (chartOk) decide(r, Math.min(ft, r.tris)); else note("Wrong chart: expected " + want("sym") + " " + tfLabel(want("tf")) + ". Did nothing."); }
          else note("Two reads disagreed, so I skipped this check.");
          }
          }
          public void onFailure(int c) {
          if (tries < 2) { tries++; h.postDelayed(() -> shot(), 4000); }
          else { tries = 0; note("Screenshot failed (" + c + ")."); }
          }
          });
          }
          }
          EOF
