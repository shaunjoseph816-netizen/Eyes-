name: Build Eyes
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate app
        run: |
          mkdir -p app/src/main/java/com/eyes app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo '' | base64 -d > app/debug.keystore
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
          namespace 'com.eyes'
          signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
          compileSdk 34
          defaultConfig { applicationId 'com.eyes'; minSdk 30; targetSdk 34; versionCode 16; versionName '16' }
          compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.WAKE_LOCK"/>
          <queries><package android:name="com.tradingview.tradingviewapp"/><package android:name="net.metaquotes.metatrader5"/></queries>
          <application android:label="Eyes" android:icon="@drawable/icon">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          <service android:name=".EyesService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/eyes_config"/></service>
          </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/eyes_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canRetrieveWindowContent="true" android:canTakeScreenshot="true" android:canPerformGestures="true" android:accessibilityFlags="flagDefault" android:description="@string/d" android:notificationTimeout="100"/>
          EOF
          cat > app/src/main/res/drawable/icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#04050C" android:pathData="M0,0h108v108h-108z"/>
          <path android:fillColor="#4F8CFF" android:pathData="M30,38h8v32h-8z M33,30h2v8h-2z M33,70h2v8h-2z"/>
          <path android:fillColor="#19E3A1" android:pathData="M50,28h8v38h-8z M53,20h2v8h-2z M53,66h2v10h-2z"/>
          <path android:fillColor="#A855F7" android:pathData="M70,44h8v30h-8z M73,36h2v8h-2z M73,74h2v8h-2z"/>
          </vector>
