          for (int y = y0; y < y1; y++) for (int x = 0; x < x1; x++) k[y * w + x] = (byte) kind(p[y * w + x]);
          boolean[] seen = new boolean[w * h];
          int[] st = new int[w * h];
          ArrayList<int[]> cs = new ArrayList<>();
          for (int y = y0; y < y1; y++) {
